          package main

          import (
          	"log"
          	"net/http"
          	"os"

          	"github.com/igmagollo/tk-tests/internal/api"
          )

          func main() {
          	addr := ":" + envOr("PORT", "8080")
          	log.Printf("listening on %s", addr)
          	if err := http.ListenAndServe(addr, api.New().Routes()); err != nil {
          		log.Fatal(err)
          	}
          }

          func envOr(key, fallback string) string {
          	if v := os.Getenv(key); v != "" {
          		return v
          	}
          	return fallback
          }
      - path: internal/api/api.go
        content: |
          // Package api contains the HTTP handlers for the demo service.
          package api

          import (
          	"encoding/json"
          	"net/http"
          	"sync"
          	"time"
          )

          type Item struct {
          	ID   int    `json:"id"`
          	Name string `json:"name"`
          }

          type Server struct {
          	mu     sync.Mutex
          	items  []Item
          	nextID int
          	start  time.Time
          }

          func New() *Server {
          	return &Server{nextID: 1, start: time.Now()}
          }

          func (s *Server) Routes() http.Handler {
          	mux := http.NewServeMux()
          	mux.HandleFunc("GET /healthz", s.health)
          	mux.HandleFunc("GET /api/items", s.listItems)
          	mux.HandleFunc("POST /api/items", s.createItem)
          	return mux
          }

          func (s *Server) health(w http.ResponseWriter, r *http.Request) {
          	writeJSON(w, http.StatusOK, map[string]any{
          		"status": "ok",
          		"uptime": time.Since(s.start).Round(time.Second).String(),
          	})
          }

          func (s *Server) listItems(w http.ResponseWriter, r *http.Request) {
          	s.mu.Lock()
          	defer s.mu.Unlock()
          	items := s.items
          	if items == nil {
          		items = []Item{}
          	}
          	writeJSON(w, http.StatusOK, items)
          }

          func (s *Server) createItem(w http.ResponseWriter, r *http.Request) {
          	var in Item
          	if err := json.NewDecoder(r.Body).Decode(&in); err != nil {
          		writeJSON(w, http.StatusBadRequest, map[string]string{"error": "invalid JSON body"})
          		return
          	}
          	if in.Name == "" {
          		writeJSON(w, http.StatusBadRequest, map[string]string{"error": "name is required"})
          		return
          	}

          	s.mu.Lock()
          	in.ID = s.nextID
          	s.nextID++
          	s.items = append(s.items, in)
          	s.mu.Unlock()

          	writeJSON(w, http.StatusCreated, in)
          }

          func writeJSON(w http.ResponseWriter, code int, body any) {
          	w.Header().Set("Content-Type", "application/json")
          	w.WriteHeader(code)
          	json.NewEncoder(w).Encode(body)
          }
      - path: internal/api/api_test.go
        content: |
          package api

          import (
          	"encoding/json"
          	"net/http"
          	"net/http/httptest"
          	"strings"
          	"testing"
          )

          func TestHealth(t *testing.T) {
          	rec := httptest.NewRecorder()
          	New().Routes().ServeHTTP(rec, httptest.NewRequest(http.MethodGet, "/healthz", nil))

          	if rec.Code != http.StatusOK {
          		t.Fatalf("got status %d, want %d", rec.Code, http.StatusOK)
          	}

          	var body map[string]string
          	if err := json.NewDecoder(rec.Body).Decode(&body); err != nil {
          		t.Fatalf("decode: %v", err)
          	}
          	if body["status"] != "ok" {
          		t.Errorf("got status %q, want %q", body["status"], "ok")
          	}
          }

          func TestListItemsStartsEmpty(t *testing.T) {
          	rec := httptest.NewRecorder()
          	New().Routes().ServeHTTP(rec, httptest.NewRequest(http.MethodGet, "/api/items", nil))

          	if rec.Code != http.StatusOK {
          		t.Fatalf("got status %d, want %d", rec.Code, http.StatusOK)
          	}
          	if got := strings.TrimSpace(rec.Body.String()); got != "[]" {
          		t.Errorf("got body %q, want %q", got, "[]")
          	}
          }

          func TestCreateThenListItem(t *testing.T) {
          	h := New().Routes()

          	rec := httptest.NewRecorder()
          	req := httptest.NewRequest(http.MethodPost, "/api/items", strings.NewReader(`{"name":"widget"}`))
          	h.ServeHTTP(rec, req)

          	if rec.Code != http.StatusCreated {
          		t.Fatalf("create: got status %d, want %d", rec.Code, http.StatusCreated)
          	}

          	var created Item
          	if err := json.NewDecoder(rec.Body).Decode(&created); err != nil {
          		t.Fatalf("decode: %v", err)
          	}
          	if created.ID != 1 || created.Name != "widget" {
          		t.Fatalf("got %+v, want {ID:1 Name:widget}", created)
          	}

          	rec = httptest.NewRecorder()
          	h.ServeHTTP(rec, httptest.NewRequest(http.MethodGet, "/api/items", nil))

          	var items []Item
          	if err := json.NewDecoder(rec.Body).Decode(&items); err != nil {
          		t.Fatalf("decode: %v", err)
          	}
          	if len(items) != 1 || items[0] != created {
          		t.Errorf("got %+v, want [%+v]", items, created)
          	}
          }

          func TestCreateItemRejectsBadInput(t *testing.T) {
          	tests := map[string]string{
          		"missing name": `{}`,
          		"empty name":   `{"name":""}`,
          		"invalid json": `{`,
          	}

          	for name, body := range tests {
          		t.Run(name, func(t *testing.T) {
          			rec := httptest.NewRecorder()
          			req := httptest.NewRequest(http.MethodPost, "/api/items", strings.NewReader(body))
          			New().Routes().ServeHTTP(rec, req)

          			if rec.Code != http.StatusBadRequest {
          				t.Errorf("got status %d, want %d", rec.Code, http.StatusBadRequest)
          			}
          		})
          	}
          }
  container:
    image: golang:1.24
    workingDir: /data/repo
    env:
      - name: GOFLAGS
        value: -mod=mod
      - name: GOPROXY
        value: "off"
    resources:
      requests:
        cpu: 512m
        memory: 512Mi
  steps:
    - name: Run unit tests
      run:
        shell: |
          set -e
          mkdir -p /data/artifacts
          go vet ./...
          go test ./... -v -coverprofile=/data/artifacts/coverage.out
          go tool cover -func=/data/artifacts/coverage.out
      artifacts:
        paths:
          - /data/artifacts/coverage.out
