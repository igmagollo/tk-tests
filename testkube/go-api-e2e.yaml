# Generated by scripts/gen-workflows.py -- do not edit by hand.
# Re-run `make tk-workflows` after changing any Go source or the e2e script.
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: go-api-e2e
  annotations:
    testworkflows.testkube.io/description: Starts the tk-tests HTTP service and runs black-box API checks against it.
  labels:
    app: tk-tests
    tool: curl
    service: api
    category: api-testing
spec:
  services:
    api:
      image: golang:1.24
      workingDir: /data/repo
      content:
        files:
          - path: go.mod
            content: |
              module github.com/igmagollo/tk-tests

              go 1.24
          - path: cmd/server/main.go
            content: |
              package main

              import (
              	"log"
              	"net/http"
              	"os"

              	"github.com/igmagollo/tk-tests/internal/api"
              )

              func main() {
              	addr := ":" + envOr("PORT", "8080")
              	log.Printf("listening on %s", addr)
              	if err := http.ListenAndServe(addr, api.New().Routes()); err != nil {
              		log.Fatal(err)
              	}
              }

              func envOr(key, fallback string) string {
              	if v := os.Getenv(key); v != "" {
              		return v
              	}
              	return fallback
              }
          - path: internal/api/api.go
            content: |
              // Package api contains the HTTP handlers for the demo service.
              package api

              import (
              	"encoding/json"
              	"net/http"
              	"sync"
              	"time"
              )

              type Item struct {
              	ID   int    `json:"id"`
              	Name string `json:"name"`
              }

              type Server struct {
              	mu     sync.Mutex
              	items  []Item
              	nextID int
              	start  time.Time
              }

              func New() *Server {
              	return &Server{nextID: 1, start: time.Now()}
              }

              func (s *Server) Routes() http.Handler {
              	mux := http.NewServeMux()
              	mux.HandleFunc("GET /healthz", s.health)
              	mux.HandleFunc("GET /api/items", s.listItems)
              	mux.HandleFunc("POST /api/items", s.createItem)
              	return mux
              }

              func (s *Server) health(w http.ResponseWriter, r *http.Request) {
              	writeJSON(w, http.StatusOK, map[string]any{
              		"status": "ok",
              		"uptime": time.Since(s.start).Round(time.Second).String(),
              	})
              }

              func (s *Server) listItems(w http.ResponseWriter, r *http.Request) {
              	s.mu.Lock()
              	defer s.mu.Unlock()
              	items := s.items
              	if items == nil {
              		items = []Item{}
              	}
              	writeJSON(w, http.StatusOK, items)
              }

              func (s *Server) createItem(w http.ResponseWriter, r *http.Request) {
              	var in Item
              	if err := json.NewDecoder(r.Body).Decode(&in); err != nil {
              		writeJSON(w, http.StatusBadRequest, map[string]string{"error": "invalid JSON body"})
              		return
              	}
              	if in.Name == "" {
              		writeJSON(w, http.StatusBadRequest, map[string]string{"error": "name is required"})
              		return
              	}

              	s.mu.Lock()
              	in.ID = s.nextID
              	s.nextID++
              	s.items = append(s.items, in)
              	s.mu.Unlock()

              	writeJSON(w, http.StatusCreated, in)
              }

              func writeJSON(w http.ResponseWriter, code int, body any) {
              	w.Header().Set("Content-Type", "application/json")
              	w.WriteHeader(code)
              	json.NewEncoder(w).Encode(body)
              }
      env:
        - name: GOFLAGS
          value: -mod=mod
        - name: GOPROXY
          value: "off"
      command:
        - go
        - run
        - ./cmd/server
      resources:
        requests:
          cpu: 512m
          memory: 512Mi
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 2
        failureThreshold: 60
  content:
    files:
      - path: test/e2e/api_test.sh
        content: |
          #!/usr/bin/env sh
          # Black-box API checks against a running server.
          # Usage: BASE_URL=http://localhost:8080 ./test/e2e/api_test.sh
          set -eu

          BASE_URL="${BASE_URL:-http://localhost:8080}"
          failures=0

          check() {
          	name="$1"
          	expected="$2"
          	actual="$3"
          	if [ "$expected" = "$actual" ]; then
          		echo "PASS  $name"
          	else
          		echo "FAIL  $name: expected [$expected], got [$actual]"
          		failures=$((failures + 1))
          	fi
          }

          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          echo "Running API checks against $BASE_URL"

          check "GET /healthz returns 200" 200 "$(status "$BASE_URL/healthz")"
          check "GET /healthz reports ok" '"status":"ok"' \
          	"$(curl -s "$BASE_URL/healthz" | grep -o '"status":"ok"' || true)"
          check "GET /api/items returns 200" 200 "$(status "$BASE_URL/api/items")"

          created=$(curl -s -X POST "$BASE_URL/api/items" -d '{"name":"e2e-widget"}')
          check "POST /api/items echoes the name" '"name":"e2e-widget"' \
          	"$(echo "$created" | grep -o '"name":"e2e-widget"' || true)"
          check "POST /api/items assigns an id" '"id":1' \
          	"$(echo "$created" | grep -o '"id":1' || true)"

          check "created item appears in the list" '"name":"e2e-widget"' \
          	"$(curl -s "$BASE_URL/api/items" | grep -o '"name":"e2e-widget"' || true)"

          check "POST /api/items rejects an empty name" 400 \
          	"$(status -X POST "$BASE_URL/api/items" -d '{"name":""}')"
          check "POST /api/items rejects invalid JSON" 400 \
          	"$(status -X POST "$BASE_URL/api/items" -d '{')"

          echo
          if [ "$failures" -eq 0 ]; then
          	echo "All checks passed."
          else
          	echo "$failures check(s) failed."
          	exit 1
          fi
  container:
    image: curlimages/curl:8.11.1
    workingDir: /data/repo
  steps:
    # The service IP only resolves once the services are up, so BASE_URL is set
    # on the step rather than on the workflow-level container.
    - name: Run API checks
      container:
        env:
          - name: BASE_URL
            value: http://{{ services.api.0.ip }}:8080
      run:
        shell: sh test/e2e/api_test.sh
